<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぶどう占い 2027 | あなたの品種と本日の出荷等級</title>
  <style>
    :root {
      --primary: #6b2d5c;
      --secondary: #7b2cbf;
      --accent: #d81b60;
      --bg: #f8f6f8;
      --card: #ffffff;
      --text: #222222;
      --gray: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 580px; background: var(--card); border-radius: 18px; padding: 26px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }

    /* プログレスバー */
    .progress-wrap { margin-bottom: 20px; }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; color: var(--primary); margin-bottom: 6px; }
    .progress-bar-bg { width: 100%; height: 8px; background: #eedfe6; border-radius: 4px; overflow: hidden; }
    .progress-fill { width: 4%; height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.3s ease; }

    /* クイズエリア */
    .q-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 18px; line-height: 1.5; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn { background: #ffffff; border: 2px solid #ecdde4; border-radius: 12px; padding: 14px 16px; text-align: left; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: all 0.15s ease; outline: none; }
    .option-btn:hover { border-color: var(--primary); background: #faf4f8; }
    .option-btn:active { transform: scale(0.98); }

    /* 第25問：スロットマシン演出 */
    .slot-machine { text-align: center; background: #2b1024; border: 4px solid #ffd700; border-radius: 16px; padding: 24px 16px; color: #fff; margin-top: 10px; }
    .slot-screen { background: #111; border: 3px solid #666; border-radius: 10px; height: 75px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: #ffeb3b; margin-bottom: 20px; letter-spacing: 1px; }
    .slot-btn { width: 100%; background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 1.15rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(220, 38, 38, 0.4); }
    .slot-btn:disabled { background: #555; box-shadow: none; cursor: not-allowed; }

    /* 結果カード */
    #result-area { display: none; }
    .result-card { border: 2px solid #ecdde4; border-radius: 14px; padding: 22px 18px; background: #fff; }
    .grade-tag { display: inline-block; font-size: 0.85rem; font-weight: bold; padding: 4px 12px; border-radius: 6px; background: #ffd700; color: #222; margin-bottom: 8px; }
    .grape-title { font-size: 1.6rem; color: var(--primary); margin-bottom: 4px; }
    .catchphrase { font-weight: bold; font-size: 0.95rem; color: #555; margin-bottom: 16px; border-left: 3px solid var(--primary); padding-left: 8px; }
    .char-desc { font-size: 0.92rem; margin-bottom: 20px; white-space: pre-line; line-height: 1.65; }

    .meta-box { background: #fdf8fa; border-radius: 10px; padding: 14px; margin-bottom: 18px; border: 1px solid #f0e2e8; }
    .meta-item { font-size: 0.88rem; margin-bottom: 8px; }
    .meta-item:last-child { margin-bottom: 0; }
    .meta-item strong { color: var(--primary); }

    /* アフィリエイトエリア */
    .affiliate-box { background: #fff7ed; border: 1.5px solid #fed7aa; border-radius: 12px; padding: 16px; margin: 20px 0; text-align: center; }
    .aff-title { font-size: 0.95rem; font-weight: bold; color: #9a3412; margin-bottom: 10px; }
    .aff-btn { display: block; width: 100%; background: #ea580c; color: #fff; text-decoration: none; font-weight: bold; font-size: 0.95rem; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
    .aff-btn.sub { background: #fff; color: #ea580c; border: 1.5px solid #ea580c; }

    .share-btn { display: flex; align-items: center; justify-content: center; width: 100%; background: #000; color: #fff; text-decoration: none; font-weight: bold; font-size: 0.95rem; padding: 12px; border-radius: 8px; margin-top: 12px; }
    .retry-btn { width: 100%; background: #e5e7eb; color: #374151; border: none; font-weight: bold; font-size: 0.9rem; padding: 10px; border-radius: 8px; margin-top: 8px; cursor: pointer; }

    /* グレープフルーツ（大凶）専用カラー */
    .is-grapefruit { border-color: #f59e0b !important; background: #fffbeb !important; }
    .is-grapefruit .grape-title { color: #d97706 !important; }
    .is-grapefruit .grade-tag { background: #dc2626 !important; color: #fff !important; }
  </style>
</head>

    nagano: {
      name: "ナガノパープル型",
      catch: "「皮を剥く時間すら惜しい。最短距離で極める黒のエリート」",
      desc: "巨峰のコクとシャインの利便性を兼ね備えたストイック完璧主義。無駄を徹底的に削ぎ落としますが、感情論に巻き込まれると粒が裂けやすいのが弱点です。",
      lucky2027: "【スチューベン】（慌てずじっくり熟成を待つ粘り強さを）",
      partner: "【甲州】（静かな職人同士、干渉せずに信頼し合える）",
      query: "ナガノパープル フルーツ"
    },
    fuji: {
      name: "藤稔（ふじみのり）型",
      catch: "「見た目はゴルフボール、中身はピュアな果汁100%」",
      desc: "規格外の器の大きさを誇る力持ち。圧倒的な存在感で場を包み込みますが、衝撃に弱くプレッシャーがかかると脱粒してしまう繊細な一面を持っています。",
      lucky2027: "【ロザリオビアンコ】（上品さと冷静さを取り入れると吉）",
      partner: "【竜宝】（不器用な者同士、お互いを優しく労わり合える）",
      query: "藤稔 ぶどう 特大"
    },
    chile: {
      name: "チリ産シードレス型",
      catch: "「マイナス18度上等。世界中どこでも平気な顔で出勤」",
      desc: "過酷な冷凍庫に放り込まれてもサクサク噛み砕ける驚異のタフネス。環境変化を一切気にせず安定した成果を出し続けますが、情緒や風情に欠けると見られがちです。",
      lucky2027: "【デラウェア】（初心に戻って素朴な甘酸っぱさを思い出す年）",
      partner: "【竜宝】（繊細な相手を無感情かつ完璧にカバーできる）",
      query: "冷凍ぶどう シードレス"
    }
  };

  // 大凶枠
  const GRAPEFRUIT = {
    name: "グレープフルーツ（凶）",
    catch: "「ぶどうヅラして生きてきた、柑橘界からの不法侵入者」",
    desc: "集団に平然と馴染んでいるようで、根本的な価値観が一切噛み合っていない異分子。特有の苦味で空気を凍らせ、分厚い皮で心をガードしています。\n※ぶどうではありません（ミカン科）。",
    lucky2027: "【デラウェア】（柑橘のトゲを捨て、初心に帰って小さく丸くなれ）",
    partner: "【角砂糖】（素直に甘やかされる覚悟を持つこと）",
    query: "シャインマスカット 訳あり"
  };

  // スロットの出目候補
  const SLOT_GRADES = [
    { label: "特秀（大吉）", text: "朝採れ完熟・ブルーム完璧。今日のあなたは無敵の仕上がり！", isGf: false },
    { label: "秀（中吉）", text: "糖度十分、贈答用クラス。周囲に配れば評価が爆上がりします。", isGf: false },
    { label: "良（吉）", text: "日常使いにちょうどいい安定感。堅実な成果が出せる良き日。", isGf: false },
    { label: "訳あり（小吉）", text: "味は抜群だが粒ぞろいが微妙。ちょっと見栄を張ると失敗しがち。", isGf: false },
    { label: "規格外・大凶", text: "選果ミス発生！ぶどうの房からなぜか柑橘類がもぎ取られました。", isGf: true } // 凶枠
  ];

  let currentQ = 0;
  const scores = {};
  let slotTimer = null;
  let slotRunning = false;
  let selectedGrade = null;

  function initQuiz() {
    renderQuestion(0);
  }

  function renderQuestion(idx) {
    const q = QUESTIONS[idx];
    document.getElementById('step-counter').innerText = `問 ${idx + 1} / 25`;
    document.getElementById('progress-fill').style.width = `${((idx + 1) / 25) * 100}%`;
    document.getElementById('q-title').innerText = q.q;

    const box = document.getElementById('options-box');
    box.innerHTML = '';

    q.opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.text;
      btn.onclick = () => selectOption(opt.type);
      box.appendChild(btn);
    });
  }

  function selectOption(type) {
    scores[type] = (scores[type] || 0) + 1;
    currentQ++;

    if (currentQ < QUESTIONS.length) {
      renderQuestion(currentQ);
    } else {
      // 24問終了 → 第25問スロットへ移行
      document.getElementById('quiz-area').style.display = 'none';
      document.getElementById('slot-area').style.display = 'block';
      document.getElementById('step-counter').innerText = `問 25 / 25（最終選別）`;
      document.getElementById('progress-fill').style.width = '100%';
      startSlotMachine();
    }
  }

  // スロット自動回転開始
  function startSlotMachine() {
    slotRunning = true;
    const screen = document.getElementById('slot-screen');
    const gradesList = ["特秀（大吉）", "秀（中吉）", "良（吉）", "訳あり（小吉）", "規格外（大凶・柑橘）"];
    let i = 0;
    slotTimer = setInterval(() => {
      screen.innerText = `🎰 ${gradesList[i % gradesList.length]}`;
      i++;
    }, 70);
  }

  // スロットSTOPボタン
  function toggleSlot() {
    if (!slotRunning) return;
    clearInterval(slotTimer);
    slotRunning = false;

    // 確率判定（大凶グレープフルーツは約8%）
    const rand = Math.random();
    if (rand < 0.08) {
      selectedGrade = SLOT_GRADES[4]; // 大凶
    } else if (rand < 0.35) {
      selectedGrade = SLOT_GRADES[0]; // 特秀
    } else if (rand < 0.70) {
      selectedGrade = SLOT_GRADES[1]; // 秀
    } else if (rand < 0.90) {
      selectedGrade = SLOT_GRADES[2]; // 良
    } else {
      selectedGrade = SLOT_GRADES[3]; // 訳あり
    }

    const screen = document.getElementById('slot-screen');
    screen.innerText = `🎯 ${selectedGrade.label}`;
    screen.style.color = selectedGrade.isGf ? "#ff5252" : "#a3e635";

    const btn = document.getElementById('slot-control-btn');
    btn.innerText = "出荷結果を見る（収穫）";
    btn.style.background = "linear-gradient(135deg, #10b981, #059669)";
    btn.onclick = showFinalResult;
  }

  function showFinalResult() {
    // 最多得票の品種を決定
    let bestType = 'king';
    let max = -1;
    for (const k in scores) {
      if (scores[k] > max) {
        max = scores[k];
        bestType = k;
      }
    }

    let grape = GRAPES[bestType] || GRAPES['king'];
    let isGf = selectedGrade.isGf;

    // 大凶スロットを引いた場合はグレープフルーツに強制上書き
    if (isGf) {
      grape = GRAPEFRUIT;
    }

    // アフィリエイトURL（※楽天アフィリエイトなどの紹介リンクに差し替え可能）
    const affSearchUrl = `https://search.rakuten.co.jp/search/mall/${encodeURIComponent(grape.query)}/`;
    const affPairUrl = `https://search.rakuten.co.jp/search/mall/${encodeURIComponent("ぶどう 食べ比べ ふるさと納税")}/`;

    const resultHtml = `
      <div class="result-card ${isGf ? 'is-grapefruit' : ''}">
        <div class="grade-tag">本日出荷：${selectedGrade.label}</div>
        <h2 class="grape-title">${grape.name}</h2>
        <div class="catchphrase">${grape.catch}</div>
        <div class="char-desc">${grape.desc}\n\n💡 <strong>本日の仕上がり判定：</strong>\n${selectedGrade.text}</div>

        <div class="meta-box">
          <div class="meta-item">🍇 <strong>2027年の開運ぶどう：</strong> ${grape.lucky2027}</div>
          <div class="meta-item">🤝 <strong>相性のいい相棒：</strong> ${grape.partner}</div>
        </div>

        <div class="affiliate-box">
          <div class="aff-title">＼ 旬の味覚を産直・ふるさと納税でチェック ／</div>
          <a href="${affSearchUrl}" class="aff-btn" target="_blank" rel="noopener">
            ${isGf ? '本物のぶどうでお口直しする（シャインマスカット等）' : `${grape.name.replace('型','')}を産直・楽天で探す`}
          </a>
          <a href="${affPairUrl}" class="aff-btn sub" target="_blank" rel="noopener">
            【相性抜群】旬のぶどう2種食べ比べセットを見る
          </a>
        </div>

        <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(`【ぶどう占い2027】25問判定の結果、【${selectedGrade.label}】${grape.name}でした！\n${grape.catch}\n\n▼あなたの品種と出荷等級をスロットで判定\n`)}&url=${encodeURIComponent(window.location.href)}" target="_blank" rel="noopener" class="share-btn">
          𝕏 で結果をポストする
        </a>
        <button class="retry-btn" onclick="location.reload()">最初からやり直す</button>
      </div>
    `;

    document.getElementById('progress-wrap').style.display = 'none';
    document.getElementById('slot-area').style.display = 'none';
    const resArea = document.getElementById('result-area');
    resArea.innerHTML = resultHtml;
    resArea.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // クイズ開始
  initQuiz();
</script>

</body>
</html>
